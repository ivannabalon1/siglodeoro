    overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.close()});

    overlay.addEventListener('cancel',()=>{overlay.style.display='none';document.body.style.overflow=''});
    document.body.appendChild(overlay);
  }
  document.getElementById('inn-map-dialog-iframe').src='index.html?abrir='+encodeURIComponent(id);

  document.body.style.overflow='hidden';

}
