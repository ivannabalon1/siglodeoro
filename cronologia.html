*{margin:0;padding:0;box-sizing:border-box}

:root{

  --border:rgba(170,21,27,0.15);
}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;overflow-x:hidden;min-height:100vh}
h1,h2,h3{font-family:'DM Serif Display',serif}

.header{text-align:center;padding:2rem 1.5rem 1.2rem;border-bottom:1px solid var(--border);
  background:#0A0A0A}
.header h1{font-size:clamp(1.5rem,4vw,2.5rem);color:var(--gold);font-weight:700;letter-spacing:.04em;margin-bottom:.3rem}
.header .sub{font-size:clamp(.75rem,2vw,.95rem);color:var(--text-dim);font-weight:300;letter-spacing:.08em;text-transform:uppercase}

.legend{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;padding:.8rem 1rem;border-bottom:1px solid var(--border)}
.legend-item{display:flex;align-items:center;gap:.3rem;font-size:.68rem;color:var(--text-dim);cursor:pointer;transition:opacity .2s;padding:.15rem .4rem;border-radius:0;min-height:32px}
.legend-item:hover{background:var(--bg3)}
.legend-item:active{background:rgba(170,21,27,.1)}
.legend-item.dimmed{opacity:.2}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

.tl-wrap{overflow-x:auto;overflow-y:visible;padding:1rem 0 2rem;-webkit-overflow-scrolling:touch;
  scrollbar-width:thin;scrollbar-color:var(--gold-dim) var(--bg2)}
.tl-wrap::-webkit-scrollbar{height:6px}
.tl-wrap::-webkit-scrollbar-track{background:var(--bg2)}
.tl-wrap::-webkit-scrollbar-thumb{background:var(--gold-dim);border-radius:0}

.timeline{display:flex;gap:0;min-width:max-content;padding:0 1.5rem}

.era{flex-shrink:0;border-left:2px solid var(--gold-dim);position:relative}
.era-label{position:sticky;top:0;background:var(--bg);padding:.4rem .8rem;font-family:'DM Serif Display',serif;
  font-size:.95rem;color:var(--gold);font-weight:600;border-bottom:1px solid var(--border);z-index:5;
  white-space:nowrap;letter-spacing:.02em}

.decades{display:flex}
.decade{min-width:140px;padding:.4rem .5rem;border-left:1px solid var(--border);position:relative}
.decade-label{font-size:.65rem;color:var(--gold-dim);text-align:center;padding-bottom:.4rem;font-weight:600;letter-spacing:.05em}

.ms-list{display:flex;flex-direction:column;gap:.35rem}

.ms-item{display:flex;align-items:flex-start;gap:.4rem;padding:.3rem .4rem;border-radius:0;cursor:pointer;
  transition:background .15s;position:relative}
.ms-item:hover{background:rgba(170,21,27,.08)}
.ms-item:active{background:rgba(170,21,27,.15)}

.ms-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:4px}
.ms-dot.t1{width:11px;height:11px;box-shadow:none}
.ms-dot.t2{width:9px;height:9px}
.ms-dot.ta{width:6px;height:6px;opacity:.7}

.ms-content{flex:1;min-width:0}
.ms-year{font-size:.6rem;color:var(--gold-dim);font-weight:600;letter-spacing:.03em}
.ms-title{font-size:.72rem;color:var(--text);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ms-title::before{content:'¿Qué cambió? ';font-size:.55rem;color:var(--gold);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.ms-autor{font-size:.6rem;color:var(--text-muted);font-style:italic;margin-top:1px}
.ms-autor::before{content:'¿Quién? ';font-style:normal;font-size:.55rem;color:var(--gold);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.ms-ambito{font-size:.58rem;color:var(--text-dim);margin-top:2px;letter-spacing:.02em}
.ms-ambito::before{content:'Ámbito: ';font-size:.55rem;color:var(--gold);text-transform:uppercase;letter-spacing:.04em;font-weight:600}

/* Tooltip */
.tooltip{display:none;position:fixed;z-index:100;background:var(--bg3);border:1px solid var(--gold);
  border-radius:0;padding:.8rem 1rem;max-width:320px;pointer-events:none;
  box-shadow:none}
.tooltip.show{display:block}
.tooltip .tt-title{font-family:'DM Serif Display',serif;font-size:1rem;color:var(--gold-light);margin-bottom:.3rem;font-weight:600}
.tooltip .tt-autor{font-size:.8rem;color:var(--text-dim);margin-bottom:.5rem}
.tooltip .tt-year{font-size:.7rem;color:var(--gold-dim);margin-bottom:.5rem}
.tooltip .tt-innov-label{font-size:.6rem;text-transform:uppercase;letter-spacing:.06em;color:var(--gold);margin-bottom:.2rem;font-weight:600}
.tooltip .tt-innov{font-size:.78rem;color:var(--text);line-height:1.4}

.prec-link-top{text-align:center;padding:.8rem 0;border-bottom:1px solid var(--border)}
.prec-link-top a{color:var(--gold);font-size:.82rem;text-decoration:none;font-weight:500;transition:color .15s}
.prec-link-top a:hover{color:var(--text)}
.prec-section{padding:1rem 0;border-bottom:1px solid var(--border)}
.prec-section-title{font-family:'DM Serif Display',serif;font-size:1rem;color:var(--gold);margin-bottom:.6rem;padding-left:.5rem;border-left:2px solid var(--gold)}
.prec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.3rem .8rem}
.prec-chip{display:flex;align-items:baseline;gap:.4rem;padding:.4rem .5rem;cursor:pointer;transition:background .15s;min-height:36px}
.prec-chip:hover{background:var(--bg3)}
.prec-chip:active{background:rgba(170,21,27,.1)}
.prec-year{font-size:.68rem;color:var(--gold-dim);flex-shrink:0;min-width:32px}
.prec-title{font-size:.72rem;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prec-autor{font-size:.68rem;color:var(--text-muted);flex-shrink:0}
@media(max-width:600px){.prec-grid{grid-template-columns:1fr}}

footer{text-align:center;padding:1.5rem;color:var(--text-muted);font-size:.7rem;border-top:1px solid var(--border)}

@media(max-width:600px){
  .header{padding:1.2rem 1rem .8rem}

  .legend-item{min-height:36px;padding:.3rem .6rem;font-size:.72rem}

  .flag-bar{display:none}

.site-nav{background:#0A0A0A;border-bottom:1px solid rgba(170,21,27,0.15);padding:.5rem 1.5rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap;position:sticky;top:0;z-index:100}
.site-nav .brand{font-family:'DM Serif Display',serif;color:#F0E6D0;font-size:1.1rem;font-weight:400;text-decoration:none;margin-right:auto}

function getColor(cat) {
  return CAT_COLORS[cat] || '#888';
}

// Active filters
let activeCategories = new Set(Object.keys(CAT_COLORS));
let activeTiers = new Set(['1','2','3','anexo']);

// Build legend
const legend = document.getElementById('legend');
const cats = [...new Set(DATA.map(m => m.categoria).filter(Boolean))].sort();
cats.forEach(cat => {
  const item = document.createElement('div');
  item.className = 'legend-item';
  item.innerHTML = `<span class="legend-dot" style="background:${getColor(cat)}"></span>${cat}`;
  item.addEventListener('click', () => {
    if (activeCategories.has(cat)) {
      activeCategories.delete(cat);
      item.classList.add('dimmed');
    } else {
      activeCategories.add(cat);
      item.classList.remove('dimmed');
    }
    renderTimeline();
  });
  legend.appendChild(item);
});

// Tooltip
const tooltip = document.getElementById('tooltip');
const ttTitle = document.getElementById('tt-title');
const ttAutor = document.getElementById('tt-autor');
const ttYear = document.getElementById('tt-year');
const ttInnov = document.getElementById('tt-innov');

function showTooltip(e, m) {
  ttYear.textContent = m.year;
  ttInnov.textContent = m.innovacion || m.titulo;
  ttAutor.textContent = m.autor;
  ttTitle.textContent = m.categoria;
  tooltip.classList.add('show');
  positionTooltip(e);
}

function positionTooltip(e) {
  const rect = tooltip.getBoundingClientRect();
  let x = e.clientX + 12;
  let y = e.clientY + 12;
  if (x + rect.width > window.innerWidth - 10) x = e.clientX - rect.width - 12;
  if (y + rect.height > window.innerHeight - 10) y = e.clientY - rect.height - 12;
  if (x < 5) x = 5;
  if (y < 5) y = 5;
  tooltip.style.left = x + 'px';
  tooltip.style.top = y + 'px';
}

function hideTooltip() {
  tooltip.classList.remove('show');
}

document.addEventListener('mousemove', (e) => {
  if (tooltip.classList.contains('show')) positionTooltip(e);
});

function renderTimeline() {
  const tl = document.getElementById('timeline');
  tl.innerHTML = '';

  const filtered = DATA.filter(m => activeCategories.has(m.categoria) && activeTiers.has(String(m.tier)));

  // Split precursors from main timeline
  const precursors = filtered.filter(m => m.is_precursor);
  const main = filtered.filter(m => !m.is_precursor);

  // Render precursors section (collapsed by default, at the end)
  if (precursors.length > 0) {
    // Add "Ver precursores" link at the top of timeline
    const precLink = document.createElement('div');
    precLink.className = 'prec-link-top';
    precLink.innerHTML = `<a href="#" onclick="event.preventDefault();document.getElementById('prec-section').style.display='block';document.getElementById('prec-section').scrollIntoView({behavior:'smooth'});this.parentElement.style.display='none';">◂ Ver ${precursors.length} precursores (antes de 1478)</a>`;
    tl.appendChild(precLink);
  }

  // Group main entries by decade
  const byDecade = {};
  main.forEach(m => {
    const dec = Math.floor(m.year / 10) * 10;
    if (!byDecade[dec]) byDecade[dec] = [];
    byDecade[dec].push(m);
  });

  // Only render eras that have main (non-precursor) content
  const mainEras = ERAS.filter(era => era.start >= 1470);
  mainEras.forEach(era => {
    const eraEl = document.createElement('div');
    eraEl.className = 'era';
    eraEl.innerHTML = `<div class="era-label">${era.label}</div><div class="decades"></div>`;
    const decadesEl = eraEl.querySelector('.decades');

    for (let d = era.start; d < era.end; d += 10) {
      const items = byDecade[d] || [];
      const decEl = document.createElement('div');
      decEl.className = 'decade';

      let html = `<div class="decade-label">${d}s</div><div class="ms-list">`;
      items.forEach(m => {
        const tierClass = m.tier === 1 ? 't1' : m.tier === 2 ? 't2' : 'ta';
        html += `<div class="ms-item" data-idx="${DATA.indexOf(m)}">
          <span class="ms-dot ${tierClass}" style="background:${getColor(m.categoria)}"></span>
          <div class="ms-content">
            <div class="ms-year">${m.year}</div>
            <div class="ms-title">${escHtml(m.innovacion || m.titulo)}</div>
            <div class="ms-autor">${escHtml(m.autor)}</div>
            <div class="ms-ambito">${escHtml(m.categoria)}</div>
          </div>
        </div>`;
      });
      html += '</div>';
      decEl.innerHTML = html;
      decadesEl.appendChild(decEl);
    }

    tl.appendChild(eraEl);
  });

  // Render precursors section at the bottom (hidden by default)
  if (precursors.length > 0) {
    const precSection = document.createElement('div');
    precSection.id = 'prec-section';
    precSection.className = 'prec-section';
    precSection.style.display = 'none';
    let precHtml = `<div class="prec-section-title">Precursores · ${precursors.length} hitos antes de 1478</div><div class="prec-grid">`;
    precursors.sort((a,b) => a.year - b.year).forEach(m => {
      precHtml += `<div class="prec-chip" data-idx="${DATA.indexOf(m)}">
        <span class="prec-year">${m.year}</span>
        <span class="prec-autor">${escHtml(m.autor)}</span>
        <span class="prec-title">— ${escHtml(m.innovacion || m.titulo)}</span>
      </div>`;
    });
    precHtml += '</div>';
    precHtml += '<div style="text-align:center;padding:1rem 0"><a href="#" style="color:var(--gold);font-size:.8rem;text-decoration:none" onclick="event.preventDefault();this.closest(\'.prec-section\').style.display=\'none\';document.querySelector(\'.prec-link-top\').style.display=\'block\';window.scrollTo({top:0,behavior:\'smooth\'})">▴ Volver al Siglo de Oro</a></div>';
    precSection.innerHTML = precHtml;
    tl.appendChild(precSection);
  }

  // Attach events to both ms-items and prec-chips
  tl.querySelectorAll('.ms-item, .prec-chip').forEach(el => {
    const idx = +el.dataset.idx;
    const m = DATA[idx];
    el.addEventListener('mouseenter', (e) => showTooltip(e, m));
    el.addEventListener('mouseleave', hideTooltip);
    el.addEventListener('click', (e) => { e.stopPropagation(); showTooltip(e, m); });
  });
}

function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Touch support
let touchTimeout;
document.addEventListener('touchstart', (e) => {
  const item = e.target.closest('.ms-item, .prec-chip');
  if (item) {
    const idx = item.dataset.idx;
    const m = idx !== undefined ? DATA[+idx] : null;
    if (m) {
      e.preventDefault();
      showTooltip(e.touches[0], m);
      clearTimeout(touchTimeout);
      touchTimeout = setTimeout(hideTooltip, 3000);
    }
  }
}, {passive: false});

document.addEventListener('touchend', () => {
  clearTimeout(touchTimeout);
  touchTimeout = setTimeout(hideTooltip, 2000);
});

renderTimeline();
// precursors now integrated in timeline
</script>


<script src="feedback-widget.js"></script>
