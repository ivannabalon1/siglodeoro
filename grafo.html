// Parse birth years
function birthYear(anos){
  if(!anos) return 1500;
  const m = anos.match(/(\d{3,4})/);
  return m ? parseInt(m[1]) : 1500;
}

// Physics
let dragging=null, mx=0, my=0, hover=null;
canvas.addEventListener('mousedown',e=>{
  const n=findNode(e.offsetX,e.offsetY);
  if(n){dragging=n;n.fx=n.x;n.fy=n.y;}
});
canvas.addEventListener('mousemove',e=>{
  mx=e.offsetX;my=e.offsetY;
  if(dragging){dragging.x=dragging.fx=mx;dragging.y=dragging.fy=my;}
  else{hover=findNode(mx,my);
    const info=document.getElementById('info');
    if(hover&&hover.tier!=='ext'){
      info.style.display='block';
      document.getElementById('info-name').textContent=hover.nombre;
      document.getElementById('info-campo').textContent=`${hover.categoria} · ${hover.anos||''}`;
      document.getElementById('info-innov').textContent=hover.innovacion_titulo||'';
    }else{info.style.display='none';}
  }
});
canvas.addEventListener('mouseup',()=>{if(dragging){delete dragging.fx;delete dragging.fy;}dragging=null;});

function findNode(x,y){
  let best=null,bestD=Infinity;
  Object.values(nodes).forEach(n=>{
    if(!activeCats[n.categoria])return;
    const d=Math.hypot(n.x-x,n.y-y);
    if(d<n.r+5&&d<bestD){best=n;bestD=d;}
  });
  return best;
}

function tick(){
  const ns=Object.values(nodes).filter(n=>activeCats[n.categoria]);
  // Repulsion
  for(let i=0;i<ns.length;i++){
    for(let j=i+1;j<ns.length;j++){
      let dx=ns[j].x-ns[i].x, dy=ns[j].y-ns[i].y;
      let d=Math.max(Math.hypot(dx,dy),1);
      let f=800/(d*d);
      ns[i].vx-=dx/d*f;ns[i].vy-=dy/d*f;
      ns[j].vx+=dx/d*f;ns[j].vy+=dy/d*f;
    }
  }
  // Attraction (edges)
  validEdges.forEach(([a,b])=>{
    const na=nodes[a],nb=nodes[b];
    if(!na||!nb||!activeCats[na.categoria]||!activeCats[nb.categoria])return;
    let dx=nb.x-na.x,dy=nb.y-na.y,d=Math.hypot(dx,dy);
    if(d>0){let f=(d-120)*0.005;na.vx+=dx/d*f;na.vy+=dy/d*f;nb.vx-=dx/d*f;nb.vy-=dy/d*f;}
  });
  // Center gravity
  ns.forEach(n=>{n.vx+=(W/2-n.x)*0.0005;n.vy+=(H/2-n.y)*0.0005;});
  // Apply
  ns.forEach(n=>{
    if(n.fx!==undefined){n.x=n.fx;n.y=n.fy;n.vx=0;n.vy=0;return;}
    n.vx*=0.85;n.vy*=0.85;
    n.x+=n.vx;n.y+=n.vy;
    n.x=Math.max(20,Math.min(W-20,n.x));
    n.y=Math.max(20,Math.min(H-20,n.y));
  });
}

function draw(){
  ctx.clearRect(0,0,W,H);
  // Edges
  validEdges.forEach(([a,b])=>{
    const na=nodes[a],nb=nodes[b];
    if(!na||!nb||!activeCats[na.categoria]||!activeCats[nb.categoria])return;
    ctx.beginPath();ctx.moveTo(na.x,na.y);ctx.lineTo(nb.x,nb.y);
    const isExt=a.startsWith('EXT')||b.startsWith('EXT');
    ctx.strokeStyle=isExt?'rgba(255,215,0,0.3)':'rgba(255,255,255,0.12)';
    ctx.lineWidth=isExt?1.5:0.8;
    if(isExt){ctx.setLineDash([4,4]);}else{ctx.setLineDash([]);}
    ctx.stroke();ctx.setLineDash([]);
    // Arrow
    const angle=Math.atan2(nb.y-na.y,nb.x-na.x);
    const mx2=(na.x+nb.x)/2,my2=(na.y+nb.y)/2;
    ctx.beginPath();
    ctx.moveTo(mx2+6*Math.cos(angle-0.4),my2+6*Math.sin(angle-0.4));
    ctx.lineTo(mx2,my2);
    ctx.lineTo(mx2+6*Math.cos(angle+0.4),my2+6*Math.sin(angle+0.4));
    ctx.strokeStyle=isExt?'rgba(255,215,0,0.5)':'rgba(255,255,255,0.2)';
    ctx.stroke();
  });
  // Nodes
  const ns=Object.values(nodes).filter(n=>activeCats[n.categoria]);
  ns.forEach(n=>{
    const isHover=hover===n;
    ctx.beginPath();ctx.arc(n.x,n.y,n.r+(isHover?3:0),0,Math.PI*2);
    ctx.fillStyle=n.color;ctx.globalAlpha=isHover?1:0.85;ctx.fill();
    ctx.globalAlpha=1;
    if(n.tier===1||n.tier==='ext'||isHover){
      ctx.strokeStyle=n.tier==='ext'?'#ffd700':'#fff';ctx.lineWidth=isHover?2:1;ctx.stroke();
    }
    // Label
    if(n.tier===1||n.tier==='ext'||isHover){
      const short=n.nombre.split(' ').slice(-1)[0];
      ctx.font=`${isHover?'bold ':''}${n.tier===1||isHover?'12':'10'}px sans-serif`;
      ctx.fillStyle='#fff';ctx.textAlign='center';
      ctx.fillText(short,n.x,n.y-n.r-5);
    }
  });
  requestAnimationFrame(()=>{tick();draw();});
}
tick();tick();tick();tick();tick();// warm up
draw();
</script>

<script id="feedback-widget">
/* Siglo de Oro — Feedback Widget */
(function(){

const SUPABASE_KEY = 'sb_publishable_OfyHIhuyFyLJgLn6F9ns-w_51hM5ufI';

.so-fb-body{padding:16px}
.so-fb-body textarea{width:100%;height:80px;background:#0A0A0A;border:1px solid rgba(170,21,27,0.2);color:#F0E6D0;font-family:Inter,sans-serif;font-size:.85rem;padding:8px;resize:vertical}
.so-fb-body textarea:focus{outline:none;border-color:#AA151B}
.so-fb-body input{width:100%;background:#0A0A0A;border:1px solid rgba(170,21,27,0.2);color:#F0E6D0;font-family:Inter,sans-serif;font-size:.82rem;padding:8px;margin-bottom:8px}
.so-fb-body input:focus{outline:none;border-color:#AA151B}
.so-fb-body label{font-size:.75rem;color:#6B5D4D;display:block;margin-bottom:4px}
.so-fb-send{background:#AA151B;border:none;color:#F0E6D0;font-family:Inter,sans-serif;font-size:.85rem;font-weight:600;padding:8px 16px;cursor:pointer;margin-top:8px;width:100%;transition:background .2s}
.so-fb-send:hover{background:#cc1a22}
.so-fb-send:disabled{opacity:.5;cursor:not-allowed}
.so-fb-thanks{text-align:center;padding:8px 0}
.so-fb-thanks p{color:#F0E6D0;font-size:.9rem;margin:0 0 12px}
.so-fb-thanks .check{color:#F1BF00;font-size:2rem;margin-bottom:8px}
.so-fb-email-ask{font-size:.78rem;color:#6B5D4D;margin-top:8px;line-height:1.5}
.so-fb-email-row{display:flex;gap:6px;margin-top:6px}
.so-fb-email-row input{flex:1;margin:0}
.so-fb-email-row button{background:#6B5D4D;border:none;color:#F0E6D0;font-size:.78rem;padding:6px 12px;cursor:pointer;white-space:nowrap}

document.body.appendChild(btn);

// Create panel
const panel = document.createElement('div');
panel.id = 'so-feedback-panel';
const page = document.title.split('—')[0]?.trim() || location.pathname.replace(/\//g,'') || 'inicio';
panel.innerHTML = `
<div class="so-fb-header"><h3>¿Qué opinas?</h3><button class="so-fb-close">&times;</button></div>
<div class="so-fb-body" id="so-fb-form-view">
  <label>Sobre</label>
  <input type="text" id="so-fb-context" value="${page}" placeholder="Página, autor, sección...">
  <label>Tu comentario</label>
  <textarea id="so-fb-comment" placeholder="Escribe aquí tu opinión, sugerencia o corrección..."></textarea>
  <button class="so-fb-send" id="so-fb-submit">Enviar</button>
</div>
<div class="so-fb-body so-fb-thanks" id="so-fb-thanks-view" style="display:none">
  <div class="check">✓</div>
  <p>¡Gracias por tu comentario!</p>
  <div class="so-fb-email-ask">Si quieres que te informemos de la evolución de esta página, déjanos tu email:</div>
  <div class="so-fb-email-row">
    <input type="email" id="so-fb-email" placeholder="tu@email.com">
    <button id="so-fb-email-send">Enviar</button>
  </div>
  <button class="so-fb-skip" id="so-fb-skip">No, gracias</button>
</div>
`;
document.body.appendChild(panel);

// State
let currentFeedbackId = null;

// Toggle panel
btn.addEventListener('click', () => panel.classList.toggle('open'));
panel.querySelector('.so-fb-close').addEventListener('click', () => panel.classList.remove('open'));

// Submit comment
document.getElementById('so-fb-submit').addEventListener('click', async function(){
  const comment = document.getElementById('so-fb-comment').value.trim();
  if(!comment) return;
  this.disabled = true;
  this.textContent = 'Enviando...';
  try {
    const resp = await fetch(SUPABASE_URL + '/rest/v1/feedback', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'Prefer': 'return=representation'
      },
      body: JSON.stringify({
        page: location.pathname,
        context: document.getElementById('so-fb-context').value.trim(),
        comment: comment,
        user_agent: navigator.userAgent.substring(0, 200)
      })
    });
    if(resp.ok){
      const data = await resp.json();
      currentFeedbackId = data[0]?.id;
      document.getElementById('so-fb-form-view').style.display = 'none';
      document.getElementById('so-fb-thanks-view').style.display = 'block';
    } else {
      this.textContent = 'Error — reintentar';
      this.disabled = false;
    }
  } catch(e) {
    this.textContent = 'Error — reintentar';
    this.disabled = false;
  }
});

// Submit email
document.getElementById('so-fb-email-send').addEventListener('click', async function(){
  const email = document.getElementById('so-fb-email').value.trim();
  if(!email || !currentFeedbackId) return;
  try {
    await fetch(SUPABASE_URL + '/rest/v1/feedback?id=eq.' + currentFeedbackId, {
      method: 'PATCH',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY
      },
      body: JSON.stringify({ email: email })
    });
  } catch(e) {}
  resetPanel();
});

// Skip email
document.getElementById('so-fb-skip').addEventListener('click', resetPanel);

function resetPanel(){
  panel.classList.remove('open');
  setTimeout(() => {
    document.getElementById('so-fb-form-view').style.display = 'block';
    document.getElementById('so-fb-thanks-view').style.display = 'none';
    document.getElementById('so-fb-comment').value = '';
    document.getElementById('so-fb-email').value = '';
    const submitBtn = document.getElementById('so-fb-submit');
    submitBtn.disabled = false;
    submitBtn.textContent = 'Enviar';
    currentFeedbackId = null;
  }, 300);
}
})();

// Collapsible controls on mobile
if(window.innerWidth <= 600) {
  const ctrl = document.getElementById('controls');
  if(ctrl) {
    const h2 = ctrl.querySelector('h2');
    if(h2) {
      h2.textContent += ' ▸';
      h2.addEventListener('click', () => {
        ctrl.classList.toggle('expanded');
        h2.textContent = ctrl.classList.contains('expanded') ? h2.textContent.replace('▸','▾') : h2.textContent.replace('▾','▸');
      });
    }
  }
}

</script>
