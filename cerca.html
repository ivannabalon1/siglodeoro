<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¿Qué tengo cerca? — La Leyenda Negra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --negro:#0A0A0A;--rojo:#AA151B;--gualda:#F1BF00;--marfil:#F0E6D0;
  --cuero:#6B5D4D;--superficie:#12100C;--borde:rgba(170,21,27,0.15);
  --ultramar:#1A3048;--rojo-hover:#C4252F;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--negro);color:var(--marfil);font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
.flag-bar{height:4px;background:linear-gradient(180deg,#AA151B 33%,#F1BF00 33% 66%,#AA151B 66%)}

header{padding:2.4rem 1.5rem 1.6rem;text-align:center;border-bottom:1px solid var(--borde)}
header h1{font-family:'DM Serif Display',serif;font-size:2.2rem;font-weight:400;color:var(--marfil);margin-bottom:.4rem}
.motto{display:flex;align-items:center;gap:.6rem;justify-content:center;margin:.3rem 0 .8rem}
.motto::before,.motto::after{content:'';flex:0 0 40px;height:1px;background:linear-gradient(90deg,transparent,var(--rojo))}
.motto::after{background:linear-gradient(90deg,var(--rojo),transparent)}
.motto span{font-size:.68rem;letter-spacing:.22em;color:var(--rojo);font-weight:700;text-transform:uppercase}
.subtitle{color:var(--cuero);max-width:560px;margin:0 auto;font-size:.88rem;line-height:1.6}

.locate-wrap{max-width:640px;margin:0 auto;padding:2rem 1.5rem;text-align:center}
#locateBtn{
  background:linear-gradient(135deg,var(--rojo),var(--rojo-hover));color:var(--marfil);border:none;
  font-family:'DM Serif Display',serif;font-size:1.15rem;padding:1rem 2.4rem;cursor:pointer;
  box-shadow:0 8px 24px rgba(170,21,27,.35);transition:transform .15s, box-shadow .15s;
  letter-spacing:.02em;
}
#locateBtn:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(170,21,27,.45)}
#locateBtn:disabled{opacity:.5;cursor:wait}
#status{margin-top:1rem;font-size:.85rem;color:var(--cuero);min-height:1.2em}
#status.err{color:var(--rojo)}
#status.ok{color:var(--gualda)}

.filters{max-width:1100px;margin:0 auto;padding:0 1.5rem 1rem;display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;justify-content:center}
.filters button{
  background:var(--superficie);border:1px solid var(--borde);color:var(--cuero);
  font-family:Inter,sans-serif;font-size:.78rem;padding:.45rem 1rem;cursor:pointer;border-radius:999px;
  transition:all .15s;letter-spacing:.02em;
}
.filters button.active{background:var(--gualda);color:var(--negro);border-color:var(--gualda);font-weight:600}
.filters button:hover:not(.active){border-color:var(--gualda);color:var(--gualda)}

#results{max-width:1100px;margin:0 auto;padding:0 1.5rem 4rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem}

.card{
  background:var(--superficie);border:1px solid var(--borde);padding:1.2rem;position:relative;
  display:flex;flex-direction:column;gap:.6rem;animation:fadeIn .4s ease backwards;
}
.card.autor{border-left:3px solid var(--gualda)}
.card.biblioteca{border-left:3px solid var(--ultramar)}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:.6rem}
.card-icon{font-size:1.4rem;line-height:1}
.card-dist{
  font-family:'DM Serif Display',serif;font-size:1.3rem;color:var(--gualda);white-space:nowrap;text-align:right;
}
.card-dist small{display:block;font-family:Inter,sans-serif;font-size:.62rem;color:var(--cuero);font-weight:400;letter-spacing:.05em}
.card h3{font-family:'DM Serif Display',serif;font-size:1.15rem;font-weight:400;color:var(--marfil);line-height:1.25}
.card .meta{font-size:.72rem;color:var(--cuero);letter-spacing:.03em;text-transform:uppercase}
.card .desc{font-size:.82rem;color:var(--marfil);opacity:.85;line-height:1.5}
.card .obras-list{font-size:.78rem;color:var(--cuero);line-height:1.6;max-height:5.6em;overflow:hidden}
.card .obras-list b{color:var(--marfil);font-weight:500}
.card-actions{display:flex;gap:.5rem;margin-top:auto;padding-top:.4rem}
.card-actions a{
  flex:1;text-align:center;font-size:.76rem;padding:.5rem .6rem;text-decoration:none;
  border:1px solid var(--borde);color:var(--marfil);transition:all .15s;letter-spacing:.02em;
}
.card-actions a.primary{background:var(--rojo);border-color:var(--rojo)}
.card-actions a.primary:hover{background:var(--rojo-hover)}
.card-actions a:not(.primary):hover{border-color:var(--gualda);color:var(--gualda)}

.empty-state{text-align:center;color:var(--cuero);padding:3rem 1rem;font-size:.9rem;grid-column:1/-1}
footer{text-align:center;padding:2rem 1rem;color:var(--cuero);font-size:.75rem;border-top:1px solid var(--borde)}
footer a{color:var(--gualda);text-decoration:none}
</style>
</head>
<body>
<div class="flag-bar"></div>
<header>
  <h1>¿Qué tengo cerca?</h1>
  <div class="motto"><span>100 autores contra el mito</span></div>
  <p class="subtitle">Comparte tu ubicación y descubre qué lugares de nacimiento, archivos y museos de la colección tienes más cerca — y cuánto se tarda en llegar andando.</p>
</header>

<div class="locate-wrap">
  <button id="locateBtn" onclick="localizar()">📍 Usar mi ubicación</button>
  <div id="status"></div>
</div>

<div class="filters" id="filters" style="display:none">
  <button class="active" data-f="todos" onclick="filtrar('todos')">Todos</button>
  <button data-f="autor" onclick="filtrar('autor')">Lugares de nacimiento</button>
  <button data-f="biblioteca" onclick="filtrar('biblioteca')">Archivos y museos</button>
</div>

<div id="results"></div>

<footer>La Leyenda Negra · 1532 · 2032 — <a href="autores.html">Volver a la colección</a></footer>

<script>
const PUNTOS = JSON.parse(document.getElementById('datos-puntos').textContent);
let userPos = null;
let filtroActual = 'todos';
let ultimaLista = [];

function haversine(lat1, lon1, lat2, lon2){
  const R = 6371; // km
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function fmtDist(km){
  if(km < 1) return {num: Math.round(km*1000), unit: 'm'};
  if(km < 10) return {num: km.toFixed(1), unit: 'km'};
  return {num: Math.round(km), unit: 'km'};
}

function fmtTiempo(km){
  const minCaminando = (km / 5) * 60; // 5km/h
  if(minCaminando < 60) return Math.round(minCaminando) + ' min andando';
  const h = minCaminando / 60;
  return h.toFixed(1) + ' h andando';
}

function localizar(){
  const btn = document.getElementById('locateBtn');
  const status = document.getElementById('status');
  btn.disabled = true;
  btn.textContent = '📍 Buscando tu ubicación…';
  status.className = '';
  status.textContent = '';

  if(!navigator.geolocation){
    status.className = 'err';
    status.textContent = 'Tu navegador no admite geolocalización.';
    btn.disabled = false;
    btn.textContent = '📍 Usar mi ubicación';
    return;
  }

  navigator.geolocation.getCurrentPosition(
    pos => {
      userPos = {lat: pos.coords.latitude, lon: pos.coords.longitude};
      btn.textContent = '📍 Ubicación obtenida';
      status.className = 'ok';
      status.textContent = 'Mostrando todo ordenado de lo más cercano a lo más lejano.';
      document.getElementById('filters').style.display = 'flex';
      render();
    },
    err => {
      btn.disabled = false;
      btn.textContent = '📍 Usar mi ubicación';
      status.className = 'err';
      if(err.code === err.PERMISSION_DENIED){
        status.textContent = 'Has denegado el permiso de ubicación. Actívalo en los ajustes del navegador para ver las distancias.';
      } else {
        status.textContent = 'No se pudo obtener tu ubicación. Inténtalo de nuevo.';
      }
    },
    {enableHighAccuracy: true, timeout: 10000}
  );
}

function filtrar(f){
  filtroActual = f;
  document.querySelectorAll('.filters button').forEach(b => b.classList.toggle('active', b.dataset.f === f));
  render();
}

function gmapsWalk(lat, lon){
  return `https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}&travelmode=walking`;
}

function cardAutor(p, km){
  const d = fmtDist(km);
  return `<div class="card autor">
    <div class="card-top">
      <div class="card-icon">🖋️</div>
      <div class="card-dist">${d.num}<small>${d.unit} · ${fmtTiempo(km)}</small></div>
    </div>
    <h3>${p.nombre}</h3>
    <div class="meta">${p.lugar} · ${p.anos} · ${p.categoria}</div>
    <div class="desc">${p.innovacion ? '<b style="color:var(--gualda)">' + p.innovacion + '</b><br>' : ''}${p.resumen || ''}${p.resumen ? '…' : ''}</div>
    <div class="card-actions">
      <a href="${p.link}">Ver ficha</a>
      <a class="primary" href="${gmapsWalk(p.lat, p.lon)}" target="_blank" rel="noopener">Cómo llegar</a>
    </div>
  </div>`;
}

function cardBiblioteca(p, km){
  const d = fmtDist(km);
  const obrasHtml = (p.obras || []).slice(0, 4).map(o => `<b>${o.titulo}</b>${o.anio ? ' (' + o.anio + ')' : ''} — ${o.autor}`).join('<br>');
  const masTexto = p.total_obras > 4 ? `<br>… y ${p.total_obras - 4} más` : '';
  return `<div class="card biblioteca">
    <div class="card-top">
      <div class="card-icon">🏛️</div>
      <div class="card-dist">${d.num}<small>${d.unit} · ${fmtTiempo(km)}</small></div>
    </div>
    <h3>${p.nombre}</h3>
    <div class="meta">${p.total_obras} obra${p.total_obras === 1 ? '' : 's'} de la colección aquí</div>
    <div class="obras-list">${obrasHtml}${masTexto}</div>
    <div class="card-actions">
      <a class="primary" href="${gmapsWalk(p.lat, p.lon)}" target="_blank" rel="noopener">Cómo llegar</a>
    </div>
  </div>`;
}

function render(){
  const results = document.getElementById('results');
  if(!userPos){
    results.innerHTML = '';
    return;
  }
  let lista = PUNTOS.map(p => ({...p, km: haversine(userPos.lat, userPos.lon, p.lat, p.lon)}));
  if(filtroActual !== 'todos'){
    lista = lista.filter(p => p.tipo === filtroActual);
  }
  lista.sort((a, b) => a.km - b.km);
  ultimaLista = lista;

  if(lista.length === 0){
    results.innerHTML = '<div class="empty-state">No hay puntos para este filtro.</div>';
    return;
  }

  results.innerHTML = lista.map((p, i) => {
    const html = p.tipo === 'autor' ? cardAutor(p, p.km) : cardBiblioteca(p, p.km);
    return html.replace('<div class="card', `<div style="animation-delay:${Math.min(i*0.03,0.6)}s" class="card`);
  }).join('');
}
</script>
</body>
</html>
